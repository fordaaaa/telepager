name: ci

# Tests on every platform we ship a binary for. The release workflow only runs
# on tags, so before this existed a platform-specific test failure first showed
# up half way through cutting a release — which is exactly how v0.2.0 broke.
on:
  push:
    branches: [main]
  pull_request:

# a force-push supersedes the run it interrupted
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test

  lint:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rustfmt is deliberately not enforced: this codebase is hand-formatted
      # and `cargo fmt` would rewrite every file in it.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
