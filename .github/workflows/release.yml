name: release

# Build the binaries, checksum them, attach them to the release, then publish
# the npm wrapper. Only runs on tags like `v0.1.0`. Publishing uses npm trusted
# publishing (oidc), so there's no token stored anywhere — it has to be set up
# once on the package's settings page on npmjs.com.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
            # cross compiled from the arm runner, so it can't run its own tests
            skip_tests: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross_linker: gcc-aarch64-linux-gnu
            skip_tests: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
    steps:
      - uses: actions/checkout@v4

      - name: Verify Cargo.toml version matches the tag
        shell: bash
        run: |
          CARGO_VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$CARGO_VERSION" != "$TAG_VERSION" ]]; then
            echo "Cargo.toml version ($CARGO_VERSION) != tag ($TAG_VERSION)" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross linker (aarch64 linux)
        if: matrix.cross_linker != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross_linker }}
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Test
        if: matrix.skip_tests != true
        run: cargo test --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/telepager${{ matrix.ext }}" \
             "dist/telepager-${{ matrix.target }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: telepager-${{ matrix.target }}
          path: dist/*

  release:
    name: checksum and release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staged

      - name: Collect and checksum
        run: |
          mkdir -p dist
          find staged -type f -exec cp {} dist/ \;
          cd dist
          for f in telepager-*; do
            sha256sum "$f" | awk '{print $1"  "$2}' > "$f.sha256"
          done
          ls -l

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/telepager-*

      # the npm job needs the binaries to build the per-platform packages
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-npm:
    name: publish to npm
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # trusted publishing needs a recent npm
      - run: npm install -g npm@latest

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Verify versions match the tag
        working-directory: npm
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PKG_VERSION" != "$TAG_VERSION" ]]; then
            echo "npm/package.json version ($PKG_VERSION) != tag ($TAG_VERSION)" >&2
            exit 1
          fi
          # the optional dependencies pin an exact version, so a stale one here
          # would install the previous release's binary alongside new js
          BAD="$(node -p "
            const d = require('./package.json').optionalDependencies || {};
            Object.entries(d).filter(([, v]) => v !== '$TAG_VERSION')
              .map(([k, v]) => k + '@' + v).join(' ')
          ")"
          if [[ -n "$BAD" ]]; then
            echo "optionalDependencies not pinned to $TAG_VERSION: $BAD" >&2
            exit 1
          fi

      - name: Build the per-platform packages
        run: node npm/scripts/build-platform-packages.js dist npm/platforms

      # these go first: the main package's optionalDependencies point at them,
      # so publishing it before they exist would break installs in between
      - name: Publish the platform packages
        working-directory: npm/platforms
        run: |
          for dir in */; do
            echo "publishing ${dir%/}"
            (cd "$dir" && npm publish --access public --provenance)
          done

      - name: Publish telepager
        working-directory: npm
        run: |
          cp ../README.md .
          npm publish --access public --provenance
