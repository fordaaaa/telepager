[package]
name = "telepager"
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["fordaaaa"]
description = "Run and watch coding agents from your phone. A Telegram pager and console for Claude Code, Codex, Gemini and friends."
repository = "https://github.com/fordaaaa/telepager"
homepage = "https://github.com/fordaaaa/telepager"
readme = "README.md"
keywords = ["mcp", "telegram", "agent", "cli", "notifications"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    "target/",
    "npm/",
    "docs/",
    ".github/",
    "install.sh",
]

[[bin]]
name = "telepager"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "process", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
dirs = "5"
portable-pty = "0.9"
vte = "0.15"

[profile.release]
strip = true
lto = true
