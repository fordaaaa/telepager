[package]
name = "telepager"
version = "0.1.1"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["fordaaaa"]
description = "An MCP server that pages you on Telegram — your agent can message you, show progress, and ask you questions with buttons."
repository = "https://github.com/fordaaaa/telepager"
readme = "README.md"

[[bin]]
name = "telepager"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "process", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
dirs = "5"

[profile.release]
strip = true
lto = true
